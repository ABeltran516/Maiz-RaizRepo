<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Maíz & Raíz</title>
</head>

<body>
    <nav class="Nav-bar">
        <a href="/">
            <h1>Maíz & Raíz</h1>
        </a>
        <div class="Shopping-cart">
            <img src="./Assets/shopping_icon.svg" alt="Shopping_Cart">
            <span>1</span>
        </div>
    </nav>
    <main>
        <section class="Hero-section">
            <span>HECHO CON PACIENCIA</span>
            <h2>Botana saludable, ingredientes simples</h2>
            <p>
                Conoce los productos saludables de Maíz & Raíz, sin aditivos ni colorantes.<br>¡Descubre una nueva forma
                de botanear!
            </p>
            <div class="Button-container">
                <button class="Btn-color1">Ver tienda</button>
                <button class="Btn-color2">Contacto</button>
            </div>
            <img class="Hero-img" src="./Assets/IMG/all-chips.jpg" alt="Chips">
        </section>
        <section class="Products-section">
            <div class="Products-headers">
                <h2>Nuestros Productos</h2>
                <a>Ver todo →</a>
            </div>
            <div class="Products-cards">
                <img src="./Assets/IMG/garbanzo.jpg" alt="Garbanzo">
                <div class="Product-info">
                    <h3>Chips de Jicama</h3>
                    <p>$55 MXN</p>
                    <p>100gr</p>
                </div>
            </div>
            <div class="Products-cards">
                <img src="./Assets/IMG/garbanzo.jpg" alt="Garbanzo">
                <div class="Product-info">
                    <h3>Title</h3>
                    <p>Price</p>
                    <p>Weight</p>
                </div>
            </div>
            <div class="Products-cards">
                <img src="./Assets/IMG/garbanzo.jpg" alt="Garbanzo">
                <div class="Product-info">
                    <h3>Title</h3>
                    <p>Price</p>
                    <p>Weight</p>
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
